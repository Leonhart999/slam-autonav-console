# Publishes the recorded warehouse replay and the read-only full console preview on GitHub Pages.
# Both run from static assets, without ROS 2 or a backend.
name: Demo

on:
  push:
    branches: [main]
    paths:
      - 'robot_console/web/**'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: robot_console/web/package-lock.json
      - name: Test and build
        working-directory: robot_console/web
        run: |
          npm ci
          npm test
          npm run build:demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: robot_console/web/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages can lag behind the successful upload when indexing a new artifact.
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if [[ $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length') -gt 0 ]]; then
              exit 0
            fi
            sleep 5
          done
          echo '::error::The uploaded Pages artifact was not visible after 60 seconds.'
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
