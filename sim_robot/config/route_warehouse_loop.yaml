# 仓库场景的建图路线（world 坐标，单位 m），给 waypoint_driver 用
# 用法：ros2 run sim_robot waypoint_driver --ros-args --params-file 本文件 -p use_sim_time:=true
#
# 场景布局（来自 make_warehouse_world.py 的注释）：
#   南区（y < -4）：三排沿 y 方向的长货架，占 x ≈ [-6.9,-4.8]、[-1.0,1.1]、[4.7,6.8]，y ≈ [-22,-4]
#   北区：两列短货架 x ≈ [-6.7,-3.2] 和 [3.3,6.8]，每列 4 排（y ≈ -0.7、2.3、5.3、8.3，每排宽 0.6 m）
#   中间通道 x ≈ [-3.2, 3.3] 从 y = -4 一直通到北墙；东侧 x ≈ 9 一路通畅；建筑范围 x ±15、y ±25
# 路线：南区东通道往北 → 中间通道一路往北 → 东侧往南 → 绕到南墙边往西 → 南区西通道往北 → 回起点
# 全程约 104 m，回到起点，方便以后评估回环
waypoint_driver:
  ros__parameters:
    waypoints: [2.9, -3.0,   0.0, -2.5,   0.0, 11.0,   9.0, 11.0,   9.0, -2.5,
                9.0, -10.0,  8.0, -23.5,  -2.9, -23.5, -2.9, -2.5,  2.9, -2.5,
                2.9, -6.0]
    max_speed: 0.5
    timeout: 900.0
