/**:
    ros__parameters:
        # FAST-LIO2 for real-robot bags played through the console's sensor adapter (robot_console/sensor_adapter.py,
        # robot_console/config/sensor_profiles.yaml). The adapter publishes cloud and IMU in one frame (origin = IMU,
        # axes = robot base, z up, acceleration in m/s^2, per-point time in s), so the extrinsic is identity.
        # Otherwise the same as fastlio_sim_vlp16.yaml.
        feature_extract_enable: false
        point_filter_num: 4
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "/home/USER/results/fastlio_map.pcd"   # absolute: FAST-LIO does not expand ~ (robot_console install.sh rewrites it)

        common:
            lid_topic:  "/points_fastlio"
            imu_topic:  "/imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 2                # Velodyne layout (x y z intensity time ring), written by the adapter
            scan_line: 128               # only used when points carry no time; the adapter always writes it
            scan_rate: 10
            timestamp_unit: 0            # s
            blind: 0.5                   # m, drops returns from the robot itself

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            extrinsic_est_en:  false
            extrinsic_T: [ 0.0, 0.0, 0.0 ]
            extrinsic_R: [ 1., 0., 0.,
                           0., 1., 0.,
                           0., 0., 1.]

        publish:
            path_en:  true
            map_en: true                 # /map_save needs the accumulated map
            scan_publish_en:  true
            dense_publish_en: true
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: true
            interval: -1

        ground_constraint:               # thesis patch, see fastlio_sim_vlp16.yaml
            enable: false
            rp_std_deg: 0.02
            z_std: 0.002
