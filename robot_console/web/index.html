<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eef2f8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Appearance chosen earlier (src/theme.ts), applied before the first paint so a dark page does not flash white -->
    <script>
      try {
        if (localStorage.getItem('robot_console.theme') === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <title>LiDAR 建图与导航控制台</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
