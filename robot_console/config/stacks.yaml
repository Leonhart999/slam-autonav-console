# 网页上能启动的进程。网页只能按名字启动这里列出的命令，不能传任意命令行。
#   label        网页上显示的名字，{zh: 中文, en: 英文}（只写一个字符串时中英文都用它）
#   description  说明，格式同 label
#   cmd          命令和参数（列表形式，不经过 shell）；可用 ~、${data_root}、${pkg:包名}（见 console.yaml）
#   before_stop  停止前先调用的服务（例如让 FAST-LIO 存图），超时后照常停止
#   stop_timeout 发 SIGINT 后最多等多少秒再发 SIGTERM（默认 10；GLIM 退出时要做全局优化并写地图，给得长一些）
#   stop_on_estop  按急停时是否一起停掉（会自己发 /cmd_vel 的进程要设 true）
#   page_only    只能由专门的页面启动（参数由页面给出，例如回放哪个数据包），监控页和 /api/stacks 不能直接启动

sim:
  label: {zh: 仿真, en: Simulation}
  description:
    zh: Gazebo 仿真 + 桥接 + 点云适配（无界面）。场景由建图页选择，在这里直接启动时是室内办公室
    en: Gazebo simulation + ROS bridge + point cloud adapter (headless). The mapping page picks the world; started here it is the indoor office
  cmd: [ros2, launch, sim_robot, sim.launch.py]

sim_gui:
  label: {zh: 仿真（带窗口）, en: Simulation (GUI)}
  description:
    zh: 同上，并打开 Gazebo 窗口
    en: Same as above, with the Gazebo window
  cmd: [ros2, launch, sim_robot, sim.launch.py, gui:=true]

mapping_fastlio:
  label: {zh: 建图 FAST-LIO2, en: Mapping (FAST-LIO2)}
  description:
    zh: FAST-LIO2：激光雷达-IMU 滤波里程计（无回环）。停止前把地图存到 ~/results/fastlio_map.pcd
    en: FAST-LIO2 - lidar-inertial filter odometry (no loop closure). Saves the map to ~/results/fastlio_map.pcd before stopping
  cmd: [ros2, launch, fast_lio, mapping.launch.py,
        'config_path:=${pkg:sim_robot}/config',
        config_file:=fastlio_sim_vlp16.yaml,
        use_sim_time:=true, rviz:=false]
  before_stop: {service: /map_save, timeout: 15}

mapping_fastlio_ground:
  label: {zh: 建图 FAST-LIO2（地面约束）, en: Mapping (FAST-LIO2, ground)}
  description:
    zh: FAST-LIO2 加地面车辆约束（本文对 FAST-LIO 的补丁）：横滚、俯仰相对重力和高度保持在起点附近，作为软约束加入滤波更新
    en: FAST-LIO2 with the ground-vehicle constraint (thesis patch of FAST-LIO) - roll and pitch relative to gravity and the height stay near their start values, as soft pseudo-measurements in the filter update
  cmd: [ros2, launch, fast_lio, mapping.launch.py,
        'config_path:=${pkg:sim_robot}/config',
        config_file:=fastlio_sim_vlp16.yaml,
        ground_constraint:=true,
        use_sim_time:=true, rviz:=false]
  before_stop: {service: /map_save, timeout: 15}

mapping_fastlio_lidar:
  label: {zh: 建图 FAST-LIO2（仅激光）, en: 'Mapping (FAST-LIO2, LiDAR only)'}
  description:
    zh: FAST-LIO2 不用 IMU（本文对 FAST-LIO 的补丁）：用前两帧估计的角速度和零加速度做匀速预测，其余不变。仿真和数据包回放都能用
    en: FAST-LIO2 without the IMU (thesis patch of FAST-LIO) - constant-velocity prediction from the angular velocity of the last two scans and zero acceleration, otherwise unchanged. For the simulation and for bags
  cmd: [ros2, launch, fast_lio, mapping.launch.py,
        'config_path:=${pkg:sim_robot}/config',
        config_file:=fastlio_lidar_only.yaml,
        ground_constraint:=false,
        use_sim_time:=true, rviz:=false]
  before_stop: {service: /map_save, timeout: 15}

mapping_fastlio_lidar_ground:
  label: {zh: 建图 FAST-LIO2（仅激光，地面约束）, en: 'Mapping (FAST-LIO2, LiDAR only, ground)'}
  description:
    zh: FAST-LIO2 仅激光模式加地面车辆约束：横滚、俯仰和高度保持在起点附近（软约束），抑制没有重力参考时的姿态漂移
    en: FAST-LIO2 LiDAR-only mode with the ground-vehicle constraint - roll, pitch and height stay near their start values (soft), against the attitude drift without a gravity reference
  cmd: [ros2, launch, fast_lio, mapping.launch.py,
        'config_path:=${pkg:sim_robot}/config',
        config_file:=fastlio_lidar_only.yaml,
        ground_constraint:=true,
        use_sim_time:=true, rviz:=false]
  before_stop: {service: /map_save, timeout: 15}

mapping_glim:
  label: {zh: 建图 GLIM, en: Mapping (GLIM)}
  description:
    zh: GLIM（CPU 版）：激光雷达-IMU 里程计 + 全局因子图（带回环）。退出时把优化后的地图和轨迹写到 <data_root>/slam/glim_dump
    en: GLIM (CPU build) - lidar-inertial odometry + global factor graph (loop closure). Writes the optimized map and trajectory to <data_root>/slam/glim_dump on exit
  cmd: [ros2, run, glim_ros, glim_rosnode, --ros-args,
        -p, 'config_path:=${pkg:sim_robot}/config/glim',
        -p, 'dump_path:=${data_root}/slam/glim_dump',
        -p, use_sim_time:=true]
  stop_timeout: 90

mapping_glim_lidar:
  label: {zh: 建图 GLIM（仅激光）, en: 'Mapping (GLIM, LiDAR only)'}
  description:
    zh: GLIM 的 CT-GICP 里程计 + 全局因子图，不用 IMU，只能用于数据包回放（点云话题 /playback/points）。退出时把地图和轨迹写到 <data_root>/slam/glim_lidar_dump
    en: GLIM CT-GICP odometry + global factor graph without IMU, for bag playback only (point cloud on /playback/points). Writes the map and trajectory to <data_root>/slam/glim_lidar_dump on exit
  cmd: [ros2, run, glim_ros, glim_rosnode, --ros-args,
        -p, 'config_path:=${pkg:robot_console}/config/glim_lidar_only',
        -p, 'dump_path:=${data_root}/slam/glim_lidar_dump',
        -p, use_sim_time:=true]
  stop_timeout: 90

playback:
  label: {zh: 数据包回放, en: Bag playback}
  description:
    zh: ros2 bag play。数据包、倍速和话题由建图页选择，不能在这里直接启动
    en: ros2 bag play. The mapping page picks the bag, rate and topics; it cannot be started from here
  cmd: [ros2, bag, play]
  page_only: true

sensor_adapter:
  label: {zh: 传感器适配, en: Sensor adapter}
  description:
    zh: 回放实车数据包时，把雷达和 IMU 按 sensor_profiles.yaml 换到 SLAM 要的坐标系和单位。由数据回放页随回放启停
    en: For bags of real robots, converts lidar and IMU into the frame and units the SLAM expects (sensor_profiles.yaml). Started and stopped with the playback
  cmd: [ros2, run, robot_console, sensor_adapter]
  page_only: true

waypoints:
  label: {zh: 自动航点, en: Auto waypoints}
  description:
    zh: 用真值闭环，沿当前场景的内置航点路线行驶（采数据用）
    en: Drives the current world's built-in waypoint route using ground truth (for data collection)
  cmd: [ros2, run, sim_robot, waypoint_driver, --ros-args, -p, use_sim_time:=true]
  stop_on_estop: true

navigation:
  label: {zh: 导航 Nav2, en: Navigation (Nav2)}
  description:
    zh: 地图服务器 + AMCL + Nav2 + 点云转激光。地图由导航页选择，在这里直接启动时用 ~/maps/office_fastlio.yaml
    en: Map server + AMCL + Nav2 + cloud-to-scan. The navigation page picks the map; started here it uses ~/maps/office_fastlio.yaml
  cmd: [ros2, launch, lidar_nav, nav.launch.py]
