# 仓库场景的导航测试：起点和目标点
# 用法：ros2 run lidar_nav nav_goals --ros-args --params-file 本文件 -p use_sim_time:=true
#
# 起点就是建图时小车的起点（world 坐标 (2.9, -6.0)，车头朝 +y，yaw = 90°），也是 map 坐标系的原点。
# map 坐标与 world 坐标的换算：x_map = y_world + 6.0，y_map = -(x_world - 2.9)
#
# 目标点（括号里是 world 坐标）：
#   1 (12.0,  2.9)  北区中间通道           (0.0,   6.0)
#   2 ( 6.8,  7.9)  西北两排短货架之间的窄通道，宽约 2.4 m   (-5.0, 0.8)
#   3 (19.0, -6.1)  东北角托盘旁            (9.0,  13.0)
#   4 (-9.0, -6.1)  东侧往南                (9.0, -15.0)
#   5 (-17.0, 5.8)  南墙边、西侧            (-2.9, -23.0)
#   6 (-6.0,  5.8)  西侧两排长货架之间的通道 (-2.9, -12.0)
#   7 ( 0.0,  0.0)  回到起点
# 节点名不是 nav_goals，而是 BasicNavigator 里固定的 basic_navigator，所以用 /** 匹配所有节点
# （第一次写成 nav_goals:，参数没生效，测试跑的是默认的办公室目标点）
/**:
  ros__parameters:
    start_x: 2.9
    start_y: -6.0
    start_yaw: 1.5708
    goals: [12.0, 2.9,   6.8, 7.9,   19.0, -6.1,   -9.0, -6.1,   -17.0, 5.8,   -6.0, 5.8,   0.0, 0.0]
    timeout: 240.0
